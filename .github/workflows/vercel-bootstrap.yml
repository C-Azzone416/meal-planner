# ONE-TIME Vercel first-deployment bootstrap. Do not run routinely.
#
# This is a Production-class provider bootstrap, not a product release. It must be separately
# approved before it is dispatched (docs/ci-cd-plan.md, "One-time first-deployment bootstrap").
# Vercel treats a new project's first CLI deployment as Production even when Preview is requested,
# so this proves both targets on a disposable slice with no database, no env vars and no tag:
#   1. Production-class deploy with --prod --skip-domain, verified to have no production-domain alias.
#   2. An explicit Preview deploy of the same SHA, verified the same way.
# After BOTH deployments pass, the operator sets repository variable PREVIEW_ENABLED=true to enable
# automatic Preview. If either fails, leave PREVIEW_ENABLED unset and update the plan.
#
# It must be dispatched from main, with a SHA reachable from origin/main (as for Production).
#
# Build/deploy split: each target runs pull -> build -> deploy as separate jobs. `vercel build`
# runs repository install and build scripts, so it runs in a job that never has VERCEL_TOKEN.
#   pull    token, no checkout during the token step. Afterwards only tools/deploy/check-pulled-env.sh is
#           checked out, at the workflow's own commit, to guard the env files.
#   build   no token. Checks out the SHA, runs `vercel build`, uploads .vercel/output as a tarball.
#   deploy  token, fresh runner, only tools/deploy checked out. Verifies the tarball checksum, runs only
#           `vercel deploy --prebuilt`, then the Vercel-API record check.
# The production-class smoke test is its own job (`smoke-production-class`, environment `preview`, no token) because
# the bypass secret lives only in the `preview` environment.
# `pull` and `deploy` of each target reference that target's environment (two approval prompts
# for `production`).
name: Vercel bootstrap

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character reviewed commit SHA of the disposable slice
        type: string
        required: true
      confirm:
        description: Type "bootstrap" to confirm this one-time, separately approved run
        type: string
        required: true

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI_VERSION: 65.9.0
  VERCEL_TELEMETRY_DISABLED: "1"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  validate:
    name: Validate bootstrap input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHA: ${{ inputs.sha }}
      CONFIRM: ${{ inputs.confirm }}
      DISPATCH_REF: ${{ github.ref }}
    steps:
      - name: Validate inputs and dispatch ref
        run: |
          [[ "$CONFIRM" == bootstrap ]] || { echo '::error::confirm must equal "bootstrap"'; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase hex SHA"; exit 1; }
          [[ "$DISPATCH_REF" == refs/heads/main ]] || { echo "::error::dispatch this workflow from main (got $DISPATCH_REF)"; exit 1; }

      - name: Check out main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: SHA is reachable from origin/main
        run: |
          git cat-file -e "${SHA}^{commit}" 2> /dev/null || { echo "::error::$SHA is not a commit in this repository"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not reachable from origin/main"; exit 1; }
          tip=$(git rev-parse origin/main)
          if [[ "$tip" != "$SHA" ]]; then
            echo "::warning::$SHA is an ancestor of, not the tip of, origin/main ($tip)"
          fi

  pull-production:
    name: Bootstrap / pull production
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions: {}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # No token here: this downloads the pinned CLI (and runs its install scripts) into the npx cache.
      - name: Prefetch pinned Vercel CLI
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" --version

      # The only token step. Nothing is checked out yet, so no repository code is present while the token is.
      - name: Vercel pull (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production

      # The guard script is the only repository code in this job: one file from the commit that defines this
      # workflow (github.workflow_sha, never inputs.sha), checked out only after the token step has finished, so
      # it never runs next to VERCEL_TOKEN. Same trust boundary as safe-extract.sh in the deploy job.
      - name: Check out env guard script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/deploy/check-pulled-env.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
          path: .env-guard

      # `vercel pull` writes .vercel/.env.<target>.local, including a live VERCEL_OIDC_TOKEN (valid ~12 hours),
      # and anyone can read this public repository's Actions artifacts. So the env files NEVER leave this job.
      # This guard checks variable NAMES only, not whether a value is secret: it fails the job if a pulled env
      # file defines anything other than Vercel system variables (VERCEL_* and the docs-cited exact names in
      # check-pulled-env.sh), or has a line it cannot parse. A failure means build-time env vars now exist and
      # this design must be revisited (the build job cannot receive them through an artifact). Names and line
      # numbers are printed, values never. A failing find (e.g. no .vercel directory) fails the job. The env
      # files are deleted afterwards, pass or fail; always() so that holds even if the checkout above failed.
      - name: Guard - pulled env files hold only Vercel system variable names, then delete them
        if: always()
        run: |
          set -euo pipefail
          trap 'find .vercel -type f -name ".env*" -delete || true' EXIT
          .env-guard/tools/deploy/check-pulled-env.sh .vercel

      # Only project.json (project/org IDs and the pulled project settings `vercel build` reads) is shipped.
      # Anything else under .vercel (README.txt, env files) is left behind; file names are logged, never contents.
      - name: Package .vercel/project.json only
        run: |
          set -euo pipefail
          [[ -f .vercel/project.json ]] || { echo "::error::vercel pull did not write .vercel/project.json"; exit 1; }
          echo "left behind (not uploaded):"; find .vercel -type f ! -name project.json || { echo "::error::find failed"; exit 1; }
          tar -cf pull.tar .vercel/project.json

      - name: Upload pull data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-production-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: pull.tar
          retention-days: 1
          if-no-files-found: error

  build-production:
    name: Bootstrap / build production
    needs: pull-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      output_sha256: ${{ steps.pack.outputs.output_sha256 }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm checkout is the requested SHA
        run: |
          head=$(git rev-parse HEAD)
          [[ "$head" == "$SHA" ]] || { echo "::error::checked out $head, expected $SHA"; exit 1; }

      - name: Download pull data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-production-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pull

      - name: Restore .vercel/project.json
        run: tar -xf "$RUNNER_TEMP/pull/pull.tar" --no-same-owner

      # The pull artifact deliberately carries no env files (they hold a live OIDC token). `vercel build` looks
      # for .vercel/.env.<target>.local and, without it and with --yes, would try to pull it itself, which needs a
      # token this job must not have. So write a stripped placeholder: a comment and one non-secret system variable.
      # The project has no build-time env vars (the pull job's guard enforces that). Not verified against a live
      # build: if `vercel build` rejects it, revisit the design rather than ship env values through an artifact.
      - name: Write placeholder env file
        run: |
          printf '# Placeholder written by the build job; pulled env values are never handed between jobs.\nVERCEL_ENV=production\n' > .vercel/.env.production.local

      # No VERCEL_TOKEN anywhere in this job: the build runs project install/build commands.
      - name: Vercel build (production)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --target=production --yes

      # `vercel build` leaves some files (the compiled Go binary lives in the runner's /tmp) outside the function
      # directory and points at them from .vc-config.json `filePathMap`. The deploy runner does not have them, so
      # copy them in before packaging and drop the map (see docs/runbooks/hosted-deploy.md). The script comes from
      # the commit that defines this workflow, checked out after the build and next to no token.
      - name: Check out materialize script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/deploy/materialize-output.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
          path: .deploy-tools

      - name: Make build output self-contained
        run: .deploy-tools/tools/deploy/materialize-output.sh .

      - name: Package build output and record checksum
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar -cf "$RUNNER_TEMP/out/build-output.tar" .vercel/output .vercel/project.json
          output_sha=$(sha256sum "$RUNNER_TEMP/out/build-output.tar" | cut -d' ' -f1)
          echo "output_sha256=$output_sha" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-production-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/build-output.tar
          retention-days: 7
          if-no-files-found: error

  deploy-production:
    name: Bootstrap / production-class (--skip-domain)
    needs: build-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions: {}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
      EXPECTED_OUTPUT_SHA256: ${{ needs.build-production.outputs.output_sha256 }}
    steps:
      # Only tools/deploy is checked out, from the commit that defines this workflow (never the build
      # artifact, never the SHA being built), so the extraction script is not attacker-influenced beyond
      # the workflow file itself. The checkout holds no token and nothing in it is executed except safe-extract.sh.
      - name: Check out deploy scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/deploy
          fetch-depth: 1
          persist-credentials: false
          path: .deploy-tools

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-production-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build

      - name: Verify build output checksum
        run: |
          [[ "$EXPECTED_OUTPUT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build job did not report a checksum"; exit 1; }
          actual=$(sha256sum "$RUNNER_TEMP/build/build-output.tar" | cut -d' ' -f1)
          [[ "$actual" == "$EXPECTED_OUTPUT_SHA256" ]] || { echo "::error::build output checksum mismatch (expected $EXPECTED_OUTPUT_SHA256, got $actual)"; exit 1; }

      # Validates entry types and names (no symlinks, hardlinks, absolute or `..` paths, nothing outside
      # .vercel/output and .vercel/project.json) and extracts into a fresh empty directory.
      - name: Validate and extract build output
        run: |
          SAFE_EXTRACT_ALLOW_RE='^\.vercel/(output(/|$)|project\.json$)' \
            .deploy-tools/tools/deploy/safe-extract.sh "$RUNNER_TEMP/build/build-output.tar" "$RUNNER_TEMP/deploy-src"

      # Defence in depth: the build job copies every `filePathMap` file into the output. A map left over would point
      # at the build runner's disk, which this runner does not have, so refuse before the token is used.
      - name: Check build output is self-contained
        run: .deploy-tools/tools/deploy/materialize-output.sh --check "$RUNNER_TEMP/deploy-src"

      # No token here. Installed only after validation, outside the extraction directory and the npx cache.
      - name: Install pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund --no-package-lock "vercel@${VERCEL_CLI_VERSION}"
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" --version

      - name: Vercel deploy (production, skip domain)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ runner.temp }}/deploy-src
        run: |
          url=$("$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prebuilt --prod --skip-domain --yes \
            --meta "sourceSha=${SHA}" 2> deploy.stderr) || { cat deploy.stderr >&2; echo "::error::vercel deploy failed"; exit 1; }
          cat deploy.stderr >&2
          url=$(printf '%s' "$url" | tail -n1 | tr -d '[:space:]')
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::unexpected deploy output, not a vercel.app URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment record (production target, no production-domain alias)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
          EXPECT_TARGET: production
        run: |
          api() { # token goes to curl through a config on stdin, never argv
            curl -fsS --max-time 30 -K - "$1" <<< "header = \"Authorization: Bearer ${VERCEL_TOKEN}\""
          }
          team=""
          [[ "$VERCEL_ORG_ID" == team_* ]] && team="teamId=${VERCEL_ORG_ID}"
          host=${URL#https://}
          dep=$(api "https://api.vercel.com/v13/deployments/${host}?${team}")
          proj=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${team}")
          # An unknown production-domain list weakens the no-alias check, so say so loudly.
          domains_note=""
          domains_inventory_complete=false
          if doms=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?limit=100&${team}"); then
            if ! domains_count=$(jq -er 'if (.domains | type) == "array" then (.domains | length) else error("domains is not an array") end' <<< "$doms"); then
              domains_note="project domains response is INVALID: the no-production-domain-alias check could not verify the inventory"
            elif [[ "$(jq -r '.pagination.next // empty' <<< "$doms")" != "" ]]; then
              domains_note="project domains list is PAGINATED: the no-production-domain-alias check could not verify the complete inventory"
            elif [[ "$domains_count" == 0 ]]; then
              domains_note="project domains list is EMPTY: the no-production-domain-alias check could not compare against any project domain"
            else
              domains_inventory_complete=true
            fi
          else
            doms='{"domains":[]}'
            domains_note="project domains fetch FAILED: the no-production-domain-alias check could not compare against any project domain"
          fi
          if [[ -n "$domains_note" ]]; then
            echo "::error::$domains_note"
          fi
          prod_names=$(jq -n --argjson p "$proj" --argjson d "$doms" \
            '[($p.targets.production.alias // [])[], ($p.alias // [])[]?.domain?, ($d.domains // [])[].name] | map(select(. != null)) | unique')
          evidence=$(jq --argjson prod_names "$prod_names" --argjson inventory_complete "$domains_inventory_complete" \
            --arg expect "$EXPECT_TARGET" --arg sha "$SHA" --arg pid "$VERCEL_PROJECT_ID" \
            -f .deploy-tools/tools/deploy/vercel-evidence.jq <<< "$dep")
          {
            echo "## Bootstrap evidence: ${EXPECT_TARGET} deployment"
            echo
            echo "- Source SHA: \`$SHA\`"
            echo "- Unique URL: $URL"
            if [[ -n "$domains_note" ]]; then
              echo "- **ERROR: $domains_note.** Verification fails closed until the production-domain inventory is known."
            else
              echo "- Project domains fetched and non-empty (production domains known: $(jq -c . <<< "$prod_names"))"
            fi
            echo '```json'
            echo "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.checks | all' <<< "$evidence" > /dev/null || { echo "::error::deployment record failed verification; see the job summary"; exit 1; }

  # The --skip-domain deployment has only its protected unique URL, so its smoke test needs the Deployment
  # Protection bypass header. That secret lives only in the `preview` environment, so this is its own job
  # under `preview`. It is a new trust boundary: no Vercel token, no checkout, no CLI, only curl. The header
  # reaches curl through a config on stdin, never a command line. (One more `preview` approval prompt, if
  # reviewers are ever set on that environment.)
  smoke-production-class:
    name: Bootstrap / smoke production-class
    needs: deploy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions: {}
    env:
      URL: ${{ needs.deploy-production.outputs.url }}
    steps:
      - name: Smoke test unique URL
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [[ "$URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "::error::missing or invalid deployment URL"; exit 1; }
          code=000
          for attempt in $(seq 1 12); do
            rm -f body.json
            # The bypass header (only when the secret is set) reaches curl through a config on stdin,
            # so it is never on a command line or in the log. Redirects are not followed.
            code=$(
              { if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
                  printf 'header = "x-vercel-protection-bypass: %s"\n' "$VERCEL_AUTOMATION_BYPASS_SECRET"
                fi; } |
                curl -sS -K - -o body.json -w '%{http_code}' --max-time 15 "$URL/api/health"
            ) || code=000
            if [[ "$code" == 200 ]] && jq -e '.status == "ok"' body.json > /dev/null 2>&1; then
              # Untrusted response body: capped at 2 KB, non-printables and backticks stripped, fenced.
              body=$(head -c 2048 body.json | LC_ALL=C tr -cd '[:print:]\n' | tr -d '`')
              {
                echo "## Bootstrap smoke: production-class unique URL"
                echo
                echo "- GET $URL/api/health -> 200 (attempt $attempt)"
                echo '```'
                echo "$body"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$code" =~ ^3[0-9][0-9]$ || "$code" == 401 || "$code" == 403 ]]; then
            if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then bypass="the bypass secret was sent"; else bypass="no bypass secret is configured"; fi
            echo "::error::HTTP $code: Vercel Deployment Protection may be blocking the unique deployment URL (401/403 or a redirect to a login page; $bypass)"
          fi
          echo "::error::smoke test failed for $URL/api/health"
          exit 1

  pull-preview:
    name: Bootstrap / pull preview
    needs: smoke-production-class
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions: {}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # No token here: this downloads the pinned CLI (and runs its install scripts) into the npx cache.
      - name: Prefetch pinned Vercel CLI
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" --version

      # The only token step. Nothing is checked out yet, so no repository code is present while the token is.
      - name: Vercel pull (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview

      # The guard script is the only repository code in this job: one file from the commit that defines this
      # workflow (github.workflow_sha, never inputs.sha), checked out only after the token step has finished, so
      # it never runs next to VERCEL_TOKEN. Same trust boundary as safe-extract.sh in the deploy job.
      - name: Check out env guard script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/deploy/check-pulled-env.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
          path: .env-guard

      # `vercel pull` writes .vercel/.env.<target>.local, including a live VERCEL_OIDC_TOKEN (valid ~12 hours),
      # and anyone can read this public repository's Actions artifacts. So the env files NEVER leave this job.
      # This guard checks variable NAMES only, not whether a value is secret: it fails the job if a pulled env
      # file defines anything other than Vercel system variables (VERCEL_* and the docs-cited exact names in
      # check-pulled-env.sh), or has a line it cannot parse. A failure means build-time env vars now exist and
      # this design must be revisited (the build job cannot receive them through an artifact). Names and line
      # numbers are printed, values never. A failing find (e.g. no .vercel directory) fails the job. The env
      # files are deleted afterwards, pass or fail; always() so that holds even if the checkout above failed.
      - name: Guard - pulled env files hold only Vercel system variable names, then delete them
        if: always()
        run: |
          set -euo pipefail
          trap 'find .vercel -type f -name ".env*" -delete || true' EXIT
          .env-guard/tools/deploy/check-pulled-env.sh .vercel

      # Only project.json (project/org IDs and the pulled project settings `vercel build` reads) is shipped.
      # Anything else under .vercel (README.txt, env files) is left behind; file names are logged, never contents.
      - name: Package .vercel/project.json only
        run: |
          set -euo pipefail
          [[ -f .vercel/project.json ]] || { echo "::error::vercel pull did not write .vercel/project.json"; exit 1; }
          echo "left behind (not uploaded):"; find .vercel -type f ! -name project.json || { echo "::error::find failed"; exit 1; }
          tar -cf pull.tar .vercel/project.json

      - name: Upload pull data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-preview-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: pull.tar
          retention-days: 1
          if-no-files-found: error

  build-preview:
    name: Bootstrap / build preview
    needs: pull-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      output_sha256: ${{ steps.pack.outputs.output_sha256 }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm checkout is the requested SHA
        run: |
          head=$(git rev-parse HEAD)
          [[ "$head" == "$SHA" ]] || { echo "::error::checked out $head, expected $SHA"; exit 1; }

      - name: Download pull data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-preview-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pull

      - name: Restore .vercel/project.json
        run: tar -xf "$RUNNER_TEMP/pull/pull.tar" --no-same-owner

      # The pull artifact deliberately carries no env files (they hold a live OIDC token). `vercel build` looks
      # for .vercel/.env.<target>.local and, without it and with --yes, would try to pull it itself, which needs a
      # token this job must not have. So write a stripped placeholder: a comment and one non-secret system variable.
      # The project has no build-time env vars (the pull job's guard enforces that). Not verified against a live
      # build: if `vercel build` rejects it, revisit the design rather than ship env values through an artifact.
      - name: Write placeholder env file
        run: |
          printf '# Placeholder written by the build job; pulled env values are never handed between jobs.\nVERCEL_ENV=preview\n' > .vercel/.env.preview.local

      # No VERCEL_TOKEN anywhere in this job: the build runs project install/build commands.
      - name: Vercel build (preview)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --target=preview --yes

      # `vercel build` leaves some files (the compiled Go binary lives in the runner's /tmp) outside the function
      # directory and points at them from .vc-config.json `filePathMap`. The deploy runner does not have them, so
      # copy them in before packaging and drop the map (see docs/runbooks/hosted-deploy.md). The script comes from
      # the commit that defines this workflow, checked out after the build and next to no token.
      - name: Check out materialize script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/deploy/materialize-output.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
          path: .deploy-tools

      - name: Make build output self-contained
        run: .deploy-tools/tools/deploy/materialize-output.sh .

      - name: Package build output and record checksum
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar -cf "$RUNNER_TEMP/out/build-output.tar" .vercel/output .vercel/project.json
          output_sha=$(sha256sum "$RUNNER_TEMP/out/build-output.tar" | cut -d' ' -f1)
          echo "output_sha256=$output_sha" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-preview-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/build-output.tar
          retention-days: 7
          if-no-files-found: error

  deploy-preview:
    name: Bootstrap / explicit preview
    needs: build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    permissions: {}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
      EXPECTED_OUTPUT_SHA256: ${{ needs.build-preview.outputs.output_sha256 }}
    steps:
      # Only tools/deploy is checked out, from the commit that defines this workflow (never the build
      # artifact, never the SHA being built), so the extraction script is not attacker-influenced beyond
      # the workflow file itself. The checkout holds no token and nothing in it is executed except safe-extract.sh.
      - name: Check out deploy scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/deploy
          fetch-depth: 1
          persist-credentials: false
          path: .deploy-tools

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-preview-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build

      - name: Verify build output checksum
        run: |
          [[ "$EXPECTED_OUTPUT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build job did not report a checksum"; exit 1; }
          actual=$(sha256sum "$RUNNER_TEMP/build/build-output.tar" | cut -d' ' -f1)
          [[ "$actual" == "$EXPECTED_OUTPUT_SHA256" ]] || { echo "::error::build output checksum mismatch (expected $EXPECTED_OUTPUT_SHA256, got $actual)"; exit 1; }

      # Validates entry types and names (no symlinks, hardlinks, absolute or `..` paths, nothing outside
      # .vercel/output and .vercel/project.json) and extracts into a fresh empty directory.
      - name: Validate and extract build output
        run: |
          SAFE_EXTRACT_ALLOW_RE='^\.vercel/(output(/|$)|project\.json$)' \
            .deploy-tools/tools/deploy/safe-extract.sh "$RUNNER_TEMP/build/build-output.tar" "$RUNNER_TEMP/deploy-src"

      # Defence in depth: the build job copies every `filePathMap` file into the output. A map left over would point
      # at the build runner's disk, which this runner does not have, so refuse before the token is used.
      - name: Check build output is self-contained
        run: .deploy-tools/tools/deploy/materialize-output.sh --check "$RUNNER_TEMP/deploy-src"

      # No token here. Installed only after validation, outside the extraction directory and the npx cache.
      - name: Install pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund --no-package-lock "vercel@${VERCEL_CLI_VERSION}"
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" --version

      - name: Vercel deploy (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ runner.temp }}/deploy-src
        run: |
          url=$("$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prebuilt --target=preview --yes \
            --meta "sourceSha=${SHA}" 2> deploy.stderr) || { cat deploy.stderr >&2; echo "::error::vercel deploy failed"; exit 1; }
          cat deploy.stderr >&2
          url=$(printf '%s' "$url" | tail -n1 | tr -d '[:space:]')
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::unexpected deploy output, not a vercel.app URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment record (preview target, no production-domain alias)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
          EXPECT_TARGET: preview
        run: |
          api() { # token goes to curl through a config on stdin, never argv
            curl -fsS --max-time 30 -K - "$1" <<< "header = \"Authorization: Bearer ${VERCEL_TOKEN}\""
          }
          team=""
          [[ "$VERCEL_ORG_ID" == team_* ]] && team="teamId=${VERCEL_ORG_ID}"
          host=${URL#https://}
          dep=$(api "https://api.vercel.com/v13/deployments/${host}?${team}")
          proj=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${team}")
          # An unknown production-domain list weakens the no-alias check, so say so loudly.
          domains_note=""
          domains_inventory_complete=false
          if doms=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?limit=100&${team}"); then
            if ! domains_count=$(jq -er 'if (.domains | type) == "array" then (.domains | length) else error("domains is not an array") end' <<< "$doms"); then
              domains_note="project domains response is INVALID: the no-production-domain-alias check could not verify the inventory"
            elif [[ "$(jq -r '.pagination.next // empty' <<< "$doms")" != "" ]]; then
              domains_note="project domains list is PAGINATED: the no-production-domain-alias check could not verify the complete inventory"
            elif [[ "$domains_count" == 0 ]]; then
              domains_note="project domains list is EMPTY: the no-production-domain-alias check could not compare against any project domain"
            else
              domains_inventory_complete=true
            fi
          else
            doms='{"domains":[]}'
            domains_note="project domains fetch FAILED: the no-production-domain-alias check could not compare against any project domain"
          fi
          if [[ -n "$domains_note" ]]; then
            echo "::error::$domains_note"
          fi
          prod_names=$(jq -n --argjson p "$proj" --argjson d "$doms" \
            '[($p.targets.production.alias // [])[], ($p.alias // [])[]?.domain?, ($d.domains // [])[].name] | map(select(. != null)) | unique')
          evidence=$(jq --argjson prod_names "$prod_names" --argjson inventory_complete "$domains_inventory_complete" \
            --arg expect "$EXPECT_TARGET" --arg sha "$SHA" --arg pid "$VERCEL_PROJECT_ID" \
            -f .deploy-tools/tools/deploy/vercel-evidence.jq <<< "$dep")
          {
            echo "## Bootstrap evidence: ${EXPECT_TARGET} deployment"
            echo
            echo "- Source SHA: \`$SHA\`"
            echo "- Unique URL: $URL"
            if [[ -n "$domains_note" ]]; then
              echo "- **ERROR: $domains_note.** Verification fails closed until the production-domain inventory is known."
            else
              echo "- Project domains fetched and non-empty (production domains known: $(jq -c . <<< "$prod_names"))"
            fi
            echo '```json'
            echo "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.checks | all' <<< "$evidence" > /dev/null || { echo "::error::deployment record failed verification; see the job summary"; exit 1; }

      - name: Smoke test unique URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          code=000
          for attempt in $(seq 1 12); do
            rm -f body.json
            # The bypass header (only when the secret is set) reaches curl through a config on stdin,
            # so it is never on a command line or in the log. Redirects are not followed.
            code=$(
              { if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
                  printf 'header = "x-vercel-protection-bypass: %s"\n' "$VERCEL_AUTOMATION_BYPASS_SECRET"
                fi; } |
                curl -sS -K - -o body.json -w '%{http_code}' --max-time 15 "$URL/api/health"
            ) || code=000
            if [[ "$code" == 200 ]] && jq -e '.status == "ok"' body.json > /dev/null 2>&1; then
              # Untrusted response body: capped at 2 KB, non-printables and backticks stripped, fenced.
              body=$(head -c 2048 body.json | LC_ALL=C tr -cd '[:print:]\n' | tr -d '`')
              {
                echo "- Smoke GET $URL/api/health -> 200 (attempt $attempt)"
                echo '```'
                echo "$body"
                echo '```'
                echo
                echo "Both deployments verified. Operator next step: set repository variable PREVIEW_ENABLED=true."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$code" =~ ^3[0-9][0-9]$ || "$code" == 401 || "$code" == 403 ]]; then
            if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then bypass="the bypass secret was sent"; else bypass="no bypass secret is configured"; fi
            echo "::error::HTTP $code: Vercel Deployment Protection may be blocking the unique deployment URL (401/403 or a redirect to a login page; $bypass)"
          fi
          echo "::error::smoke test failed for $URL/api/health"
          exit 1
