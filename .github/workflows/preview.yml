# Reusable Preview deploy: pull -> build -> deploy --prebuilt -> smoke, in separate jobs.
# Called by ci.yml for pushes to develop only (never pull requests).
# See docs/ci-cd-plan.md (Hosted Preview pipeline) and docs/runbooks/hosted-deploy.md.
#
# Build/deploy split: `vercel build` runs repository install and build scripts, so it runs in a
# job that never has VERCEL_TOKEN. Jobs:
#   pull   token, no checkout, no repository code. Uploads only .vercel/project.json (never the env files).
#   build  no token. Checks out the SHA, runs `vercel build`, uploads .vercel/output as a tarball.
#   deploy token, fresh runner, only tools/deploy checked out. Verifies the tarball checksum, validates and
#          extracts it with safe-extract.sh, then only runs `vercel deploy --prebuilt`, then the smoke test
#          (the `preview` environment's optional VERCEL_AUTOMATION_BYPASS_SECRET is read here, in step env only),
#          then, if vars.PREVIEW_ALIAS is set, points that stable alias at the new deployment.
name: Preview

on:
  workflow_call:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy as Preview
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
    outputs:
      url:
        description: Unique Preview deployment URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

# Preview deploys come only from develop pushes. Every develop commit deploys; none is cancelled, so no
# commit's CI shows a cancelled preview. Runs for different SHAs may overlap, so the stable alias step only
# moves the alias when its SHA is still the tip of develop (an older deploy finishing late cannot take it back).
concurrency:
  group: preview-${{ inputs.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI_VERSION: 65.9.0
  VERCEL_TELEMETRY_DISABLED: "1"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  pull:
    name: Deploy / preview-pull
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions: {}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # No token here: this downloads the pinned CLI (and runs its install scripts) into the npx cache.
      - name: Prefetch pinned Vercel CLI
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" --version

      # The only token step. There is no checkout, so no repository code is present.
      - name: Vercel pull (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview

      # `vercel pull` writes .vercel/.env.<target>.local, including a live VERCEL_OIDC_TOKEN (valid ~12 hours),
      # and anyone can read this public repository's Actions artifacts. So the env files NEVER leave this job.
      # This guard checks variable NAMES only, not whether a value is secret: it fails the job if a pulled env
      # file defines anything other than Vercel system variables (VERCEL_*). A failure means build-time env vars
      # now exist and this design must be revisited (the build job cannot receive them through an artifact).
      # Values are never printed. The env files are deleted afterwards, pass or fail.
      - name: Guard - pulled env files hold only Vercel system variable names, then delete them
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/envfiles.list"
          trap 'find .vercel -type f -name ".env*" -delete || true' EXIT
          # A failing find (e.g. no .vercel directory) must fail the job, so it is not inside a process substitution.
          find .vercel -type f -name '.env*' -print0 > "$list" || { echo "::error::find failed while looking for pulled env files"; exit 1; }
          bad=0
          while IFS= read -r -d '' f; do
            n=$(awk '!/^[[:space:]]*(#|$)/ && !/^(export[[:space:]]+)?VERCEL_[A-Za-z0-9_]*=/ {c++} END {print c+0}' "$f")
            if [[ "$n" -gt 0 ]]; then
              echo "::error::$f has $n non-comment line(s) whose name is not a Vercel system variable (VERCEL_*); build-time env vars exist, so this env handoff design must be revisited"
              bad=1
            fi
          done < "$list"
          exit "$bad"

      # Only project.json (project/org IDs and the pulled project settings `vercel build` reads) is shipped.
      # Anything else under .vercel (README.txt, env files) is left behind; file names are logged, never contents.
      - name: Package .vercel/project.json only
        run: |
          set -euo pipefail
          [[ -f .vercel/project.json ]] || { echo "::error::vercel pull did not write .vercel/project.json"; exit 1; }
          echo "left behind (not uploaded):"; find .vercel -type f ! -name project.json || { echo "::error::find failed"; exit 1; }
          tar -cf pull.tar .vercel/project.json

      # pull.tar holds only .vercel/project.json; env files never leave the pull job.
      - name: Upload pull data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: pull.tar
          retention-days: 1
          if-no-files-found: error

  build:
    name: Deploy / preview-build
    needs: pull
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      output_sha256: ${{ steps.pack.outputs.output_sha256 }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Validate SHA input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase hex SHA"; exit 1; }

      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm checkout is the requested SHA
        run: |
          head=$(git rev-parse HEAD)
          [[ "$head" == "$SHA" ]] || { echo "::error::checked out $head, expected $SHA"; exit 1; }

      # Schema migrations are intentionally skipped: there is no database schema yet. This guard fails
      # loudly if migrations appear before a runner is wired. When one exists, run the reviewed
      # forward-only migration in its own job before `deploy`, using only the Preview migrator
      # credential from the `preview` environment.
      - name: Migrate Preview database (skipped, no schema yet)
        if: ${{ hashFiles('db/migrations/**') != '' }}
        run: |
          echo "::error::migrations found under db/migrations but no migration runner is wired yet"
          exit 1

      - name: Download pull data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-pull-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pull

      - name: Restore .vercel/project.json
        run: tar -xf "$RUNNER_TEMP/pull/pull.tar" --no-same-owner

      # The pull artifact deliberately carries no env files (they hold a live OIDC token). `vercel build` looks
      # for .vercel/.env.<target>.local and, without it and with --yes, would try to pull it itself, which needs a
      # token this job must not have. So write a stripped placeholder: a comment and one non-secret system variable.
      # The project has no build-time env vars (the pull job's guard enforces that). Not verified against a live
      # build: if `vercel build` rejects it, revisit the design rather than ship env values through an artifact.
      - name: Write placeholder env file
        run: |
          printf '# Placeholder written by the build job; pulled env values are never handed between jobs.\nVERCEL_ENV=preview\n' > .vercel/.env.preview.local

      # No VERCEL_TOKEN anywhere in this job: the build runs project install/build commands.
      - name: Vercel build (preview)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --target=preview --yes

      - name: Package build output and record checksum
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar -cf "$RUNNER_TEMP/out/build-output.tar" .vercel/output .vercel/project.json
          output_sha=$(sha256sum "$RUNNER_TEMP/out/build-output.tar" | cut -d' ' -f1)
          echo "output_sha256=$output_sha" >> "$GITHUB_OUTPUT"
          git ls-files | grep -E '(^|/)(go\.mod|go\.sum|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$' | sort | xargs -r sha256sum > lockfiles.txt
          lockfiles=$(jq -Rn '[inputs | capture("^(?<h>[0-9a-f]{64})  (?<p>.*)$")] | map({(.p): .h}) | add // {}' < lockfiles.txt)
          jq -n \
            --arg sha "$SHA" \
            --arg target preview \
            --argjson lockfiles "$lockfiles" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --arg go "$(go version 2>/dev/null || echo unavailable)" \
            --arg vercel "$(npx --yes "vercel@${VERCEL_CLI_VERSION}" --version | tail -n1)" \
            --arg output_sha "$output_sha" \
            '{source_sha: $sha, target: $target, lockfile_sha256: $lockfiles,
              tools: {node: $node, npm: $npm, go: $go, vercel_cli: $vercel},
              build_output_tar_sha256: $output_sha}' > "$RUNNER_TEMP/out/manifest.json"

      # Only the build output tarball and manifest are uploaded; never the pulled env files.
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/build-output.tar
            ${{ runner.temp }}/out/manifest.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy / preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions: {}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
      EXPECTED_OUTPUT_SHA256: ${{ needs.build.outputs.output_sha256 }}
      PREVIEW_ALIAS: ${{ vars.PREVIEW_ALIAS }}
    steps:
      - name: Validate SHA input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase hex SHA"; exit 1; }

      # Only tools/deploy is checked out, from the commit that defines this workflow (never the build
      # artifact, never the SHA being built), so the extraction script is not attacker-influenced beyond
      # the workflow file itself. The checkout holds no token and nothing in it is executed except safe-extract.sh.
      - name: Check out deploy scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/deploy
          fetch-depth: 1
          persist-credentials: false
          path: .deploy-tools

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-build-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build

      - name: Verify build output checksum
        run: |
          [[ "$EXPECTED_OUTPUT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build job did not report a checksum"; exit 1; }
          actual=$(sha256sum "$RUNNER_TEMP/build/build-output.tar" | cut -d' ' -f1)
          [[ "$actual" == "$EXPECTED_OUTPUT_SHA256" ]] || { echo "::error::build output checksum mismatch (expected $EXPECTED_OUTPUT_SHA256, got $actual)"; exit 1; }

      # Validates entry types and names (no symlinks, hardlinks, absolute or `..` paths, nothing outside
      # .vercel/output and .vercel/project.json) and extracts into a fresh empty directory.
      - name: Validate and extract build output
        run: |
          SAFE_EXTRACT_ALLOW_RE='^\.vercel/(output(/|$)|project\.json$)' \
            .deploy-tools/tools/deploy/safe-extract.sh "$RUNNER_TEMP/build/build-output.tar" "$RUNNER_TEMP/deploy-src"

      # No token here. Installed only after validation, outside the extraction directory and the npx cache.
      - name: Install pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund --no-package-lock "vercel@${VERCEL_CLI_VERSION}"
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" --version

      - name: Vercel deploy (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ runner.temp }}/deploy-src
        run: |
          url=$("$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prebuilt --target=preview --yes \
            --meta "sourceSha=${SHA}" 2> deploy.stderr) || { cat deploy.stderr >&2; echo "::error::vercel deploy failed"; exit 1; }
          cat deploy.stderr >&2
          url=$(printf '%s' "$url" | tail -n1 | tr -d '[:space:]')
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::unexpected deploy output, not a vercel.app URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record manifest
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          jq --arg url "$URL" --arg out "$EXPECTED_OUTPUT_SHA256" \
            '. + {deployment_url: $url, build_output_tar_sha256: $out}' "$RUNNER_TEMP/build/manifest.json" > preview-manifest.json
          {
            echo "## Preview deployment"
            echo
            echo "- Source SHA: \`$SHA\`"
            echo "- URL: $URL"
            echo "- Build output checksum verified: \`$EXPECTED_OUTPUT_SHA256\`"
            echo
            echo '```json'
            cat preview-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-manifest-${{ inputs.sha }}-${{ github.run_attempt }}
          path: preview-manifest.json
          if-no-files-found: error

      # Runs in this job so it can read the `preview` environment secret directly; a caller cannot pass
      # environment secrets into a reusable workflow. The secret is only in this step's env, the token only in the deploy step's.
      - name: Smoke test /api/health
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::missing or invalid deployment URL"; exit 1; }
          code=000
          for attempt in $(seq 1 12); do
            rm -f body.json
            # The bypass header (only when the secret is set) reaches curl through a config on stdin,
            # so it is never on a command line or in the log. Redirects are not followed.
            code=$(
              { if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
                  printf 'header = "x-vercel-protection-bypass: %s"\n' "$VERCEL_AUTOMATION_BYPASS_SECRET"
                fi; } |
                curl -sS -K - -o body.json -w '%{http_code}' --max-time 15 "$URL/api/health"
            ) || code=000
            if [[ "$code" == 200 ]] && jq -e '.status == "ok"' body.json > /dev/null 2>&1; then
              # Untrusted response body: capped at 2 KB, non-printables and backticks stripped, fenced.
              body=$(head -c 2048 body.json | LC_ALL=C tr -cd '[:print:]\n' | tr -d '`')
              {
                echo "## Preview smoke"
                echo
                echo "- GET $URL/api/health -> 200 (attempt $attempt)"
                echo '```'
                echo "$body"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$code" =~ ^3[0-9][0-9]$ || "$code" == 401 || "$code" == 403 ]]; then
            if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then bypass="the bypass secret was sent"; else bypass="no bypass secret is configured"; fi
            echo "::error::HTTP $code: Vercel Deployment Protection may be blocking the unique deployment URL (401/403 or a redirect to a login page; $bypass)"
          fi
          echo "::error::smoke test failed for $URL/api/health"
          exit 1

      # Optional stable alias (repository variable PREVIEW_ALIAS, e.g. meal-planner-develop.vercel.app). Runs only
      # after the deploy and smoke test succeeded. Unset means skip with a notice. The alias must never be a
      # project production domain. It only moves if SHA is still the tip of develop (unauthenticated lookup:
      # the repository is public and this job has no GitHub token); otherwise a newer run moves it. A failed
      # tip lookup fails the step. After `vercel alias set`, poll the Vercel API until the alias points at THIS
      # deployment ID, as deploy-production.yml does. Token only in this step's env, config to curl on stdin.
      - name: Point stable alias at this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        working-directory: ${{ runner.temp }}/deploy-src
        run: |
          if [[ -z "${PREVIEW_ALIAS:-}" ]]; then
            echo "::notice::PREVIEW_ALIAS is not set; skipping the stable alias"
            exit 0
          fi
          alias="${PREVIEW_ALIAS,,}"
          [[ "$alias" =~ ^[A-Za-z0-9.-]+$ && "$alias" == *.* ]] || { echo "::error::PREVIEW_ALIAS must be a hostname such as meal-planner-develop.vercel.app"; exit 1; }
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::missing or invalid deployment URL"; exit 1; }
          api() {
            curl -fsS --max-time 30 -K - "$1" <<< "header = \"Authorization: Bearer ${VERCEL_TOKEN}\""
          }
          team=""
          [[ "$VERCEL_ORG_ID" == team_* ]] && team="teamId=${VERCEL_ORG_ID}"

          # Never alias a production domain. Same candidate list as deploy-production.yml; fail closed if unreadable.
          proj=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${team}") || { echo "::error::could not fetch the Vercel project"; exit 1; }
          doms=$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?${team}") || { echo "::error::could not fetch the project domains"; exit 1; }
          cands=$(jq -n --argjson p "$proj" --argjson d "$doms" \
            '[($p.targets.production.alias // [])[], (($p.alias // [])[] | .domain? // empty), (($d.domains // [])[] | select((.redirect // null) == null and (.gitBranch // null) == null) | .name)]
             | map(select(type == "string") | ascii_downcase) | unique')
          if jq -e --arg a "$alias" 'index($a) != null' <<< "$cands" > /dev/null; then
            echo "::error::PREVIEW_ALIAS $alias is a production domain of this project; refusing to alias a Preview to it"
            exit 1
          fi

          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/develop | cut -f1) || tip=""
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not determine the tip of develop"; exit 1; }
          if [[ "$tip" != "$SHA" ]]; then
            echo "::notice::$SHA is no longer the tip of develop ($tip); skipping the alias, the newer run will move it"
            exit 0
          fi

          id=$(api "https://api.vercel.com/v13/deployments/${URL#https://}?${team}" | jq -r '.id // empty') || id=""
          [[ "$id" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "::error::could not look up the Vercel deployment ID for $URL"; exit 1; }

          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" alias set "$URL" "$alias" --scope "$VERCEL_ORG_ID" || { echo "::error::vercel alias set failed"; exit 1; }

          for attempt in $(seq 1 18); do
            pointed=$(api "https://api.vercel.com/v4/aliases/${alias}?${team}" | jq -r '.deploymentId // empty') || pointed=""
            if [[ "$pointed" == "$id" ]]; then
              {
                echo "## Preview alias"
                echo
                echo "- Alias: \`$alias\`"
                echo "- Deployment ID: \`$id\`"
                echo "- Source SHA: \`$SHA\`"
                echo "- Vercel API confirms the alias points at this deployment (attempt $attempt)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: $alias points at ${pointed:-<unknown>}, waiting for $id"
            sleep 10
          done
          echo "::error::the alias $alias did not point at deployment $id within 3 minutes"
          exit 1
