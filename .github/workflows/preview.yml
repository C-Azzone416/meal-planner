# Reusable Preview deploy: pull -> build -> deploy --prebuilt -> smoke.
# Called by ci.yml for trusted same-repository hosted pull requests only.
# See docs/ci-cd-plan.md (Hosted Preview pipeline) and docs/runbooks/hosted-deploy.md.
#
# Token rule: VERCEL_TOKEN is a repository-scoped secret. It is set via `env:` only on the
# `vercel pull` and `vercel deploy` steps. It is never given to checkout, CLI prefetch,
# `vercel build` (which runs the project's build commands), manifest, upload or smoke steps.
name: Preview

on:
  workflow_call:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy as Preview
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
    outputs:
      url:
        description: Unique Preview deployment URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI_VERSION: 65.9.0
  VERCEL_TELEMETRY_DISABLED: "1"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  deploy:
    name: Deploy / preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Validate SHA input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase hex SHA"; exit 1; }

      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm checkout is the requested SHA
        run: |
          head=$(git rev-parse HEAD)
          [[ "$head" == "$SHA" ]] || { echo "::error::checked out $head, expected $SHA"; exit 1; }

      # No token here: this downloads the pinned CLI (and runs its install scripts) into the npx cache.
      - name: Prefetch pinned Vercel CLI
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" --version

      - name: Vercel pull (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview

      # Deliberately no VERCEL_TOKEN: the build runs project install/build commands.
      - name: Vercel build (preview)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --target=preview --yes

      - name: Write build manifest
        run: |
          {
            git ls-files | grep -E '(^|/)(go\.mod|go\.sum|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$' | sort | xargs -r sha256sum
          } > lockfiles.txt
          lockfiles=$(jq -Rn '[inputs | capture("^(?<h>[0-9a-f]{64})  (?<p>.*)$")] | map({(.p): .h}) | add // {}' < lockfiles.txt)
          output_sha=$(cd .vercel/output && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          jq -n \
            --arg sha "$SHA" \
            --arg target preview \
            --argjson lockfiles "$lockfiles" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --arg go "$(go version 2>/dev/null || echo unavailable)" \
            --arg vercel "$(npx --yes "vercel@${VERCEL_CLI_VERSION}" --version | tail -n1)" \
            --arg output_sha "$output_sha" \
            '{source_sha: $sha, target: $target, lockfile_sha256: $lockfiles,
              tools: {node: $node, npm: $npm, go: $go, vercel_cli: $vercel},
              build_output_sha256: $output_sha}' > manifest.json

      # Schema migrations are intentionally skipped: there is no database schema yet.
      # When one exists, run the reviewed forward-only migration here, using only the
      # Preview migrator credential from the `preview` environment, before the deploy.
      - name: Migrate Preview database (skipped, no schema yet)
        if: ${{ hashFiles('db/migrations/**') != '' }}
        run: |
          echo "::error::migrations found under db/migrations but no migration runner is wired yet"
          exit 1

      - name: Vercel deploy (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --target=preview --yes \
            --meta "sourceSha=${SHA}" 2> deploy.stderr) || { cat deploy.stderr >&2; echo "::error::vercel deploy failed"; exit 1; }
          cat deploy.stderr >&2
          url=$(printf '%s' "$url" | tail -n1 | tr -d '[:space:]')
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::unexpected deploy output, not a vercel.app URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record manifest
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          jq --arg url "$URL" '. + {deployment_url: $url}' manifest.json > preview-manifest.json
          {
            echo "## Preview deployment"
            echo
            echo "- Source SHA: \`$SHA\`"
            echo "- URL: $URL"
            echo
            echo '```json'
            cat preview-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the manifest is uploaded; never .vercel/ (it holds pulled environment values).
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-manifest-${{ inputs.sha }}
          path: preview-manifest.json
          if-no-files-found: error

  smoke:
    name: Deploy / preview-smoke
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Smoke test /api/health
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::missing or invalid deployment URL"; exit 1; }
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 15 "$URL/api/health" || echo 000)
            if [[ "$code" == 200 ]] && jq -e '.status == "ok"' body.json > /dev/null; then
              {
                echo "## Preview smoke"
                echo
                echo "- GET $URL/api/health -> 200 (attempt $attempt)"
                echo '```json'
                cat body.json
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$code" == 401 || "$code" == 403 ]]; then
            echo "::error::HTTP $code: Vercel Deployment Protection may be blocking the unique deployment URL"
          fi
          echo "::error::smoke test failed for $URL/api/health"
          exit 1
