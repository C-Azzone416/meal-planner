# Manual Production release of the hosted web/API for one exact `main` SHA.
# See docs/ci-cd-plan.md (Hosted Production pipeline) and docs/runbooks/hosted-deploy.md.
#
# Token rule: VERCEL_TOKEN is a repository-scoped secret. It is set via `env:` only on the
# `vercel pull` and `vercel deploy` steps. It is never given to checkout, CLI prefetch,
# `vercel build` (which runs the project's build commands), manifest or smoke steps.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA of the final main commit to release
        type: string
        required: true
      version:
        description: Release tag to create on success, e.g. app-v1.2.3
        type: string
        required: true

permissions: {}

# Serialize releases; never cancel one that is in progress.
concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI_VERSION: 65.9.0
  VERCEL_TELEMETRY_DISABLED: "1"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  verify:
    name: Verify release input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout and tag lookup
      actions: read # ci.yml run and job conclusions for the SHA
    env:
      SHA: ${{ inputs.sha }}
      VERSION: ${{ inputs.version }}
      REPO: ${{ github.repository }}
      DISPATCH_REF: ${{ github.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs and dispatch ref
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase hex SHA"; exit 1; }
          [[ "$VERSION" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must match ^app-v[0-9]+\.[0-9]+\.[0-9]+$"; exit 1; }
          [[ "$DISPATCH_REF" == refs/heads/main ]] || { echo "::error::dispatch this workflow from main (got $DISPATCH_REF)"; exit 1; }

      - name: Check out main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: SHA is reachable from origin/main
        run: |
          git cat-file -e "${SHA}^{commit}" 2> /dev/null || { echo "::error::$SHA is not a commit in this repository"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not reachable from origin/main"; exit 1; }
          tip=$(git rev-parse origin/main)
          if [[ "$tip" != "$SHA" ]]; then
            echo "::warning::$SHA is an ancestor of, not the tip of, origin/main ($tip)"
          fi

      - name: Tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      # Runs the script from main (the dispatch ref is enforced above), not from the requested SHA.
      - name: Require successful CI / required for this SHA on main
        run: |
          result=$(tools/deploy/verify-ci.sh "$SHA")
          echo "$result"
          {
            echo "## Release verification"
            echo
            echo "- SHA \`$SHA\` is reachable from origin/main"
            echo "- Version \`$VERSION\` is unused"
            echo "- $result"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy / production
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write # only for the final tag push; the token is passed to that one step
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHA: ${{ inputs.sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm checkout is the requested SHA
        run: |
          head=$(git rev-parse HEAD)
          [[ "$head" == "$SHA" ]] || { echo "::error::checked out $head, expected $SHA"; exit 1; }

      # No token here: this downloads the pinned CLI (and runs its install scripts) into the npx cache.
      - name: Prefetch pinned Vercel CLI
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" --version

      - name: Vercel pull (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production

      # Deliberately no VERCEL_TOKEN: the build runs project install/build commands.
      - name: Vercel build (production)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --yes

      - name: Write build manifest
        run: |
          git ls-files | grep -E '(^|/)(go\.mod|go\.sum|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$' | sort | xargs -r sha256sum > lockfiles.txt
          lockfiles=$(jq -Rn '[inputs | capture("^(?<h>[0-9a-f]{64})  (?<p>.*)$")] | map({(.p): .h}) | add // {}' < lockfiles.txt)
          output_sha=$(cd .vercel/output && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          jq -n \
            --arg sha "$SHA" \
            --arg version "$VERSION" \
            --arg target production \
            --argjson lockfiles "$lockfiles" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --arg go "$(go version 2>/dev/null || echo unavailable)" \
            --arg vercel "$(npx --yes "vercel@${VERCEL_CLI_VERSION}" --version | tail -n1)" \
            --arg output_sha "$output_sha" \
            '{source_sha: $sha, version: $version, target: $target, lockfile_sha256: $lockfiles,
              tools: {node: $node, npm: $npm, go: $go, vercel_cli: $vercel},
              build_output_sha256: $output_sha}' > manifest.json

      # Schema migrations are intentionally skipped: there is no database schema yet.
      # When one exists, apply only reviewed, forward-compatible migrations here through the
      # direct Production migrator connection (production environment secret), before the deploy.
      - name: Migrate Production database (skipped, no schema yet)
        if: ${{ hashFiles('db/migrations/**') != '' }}
        run: |
          echo "::error::migrations found under db/migrations but no migration runner is wired yet"
          exit 1

      - name: Vercel deploy (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes \
            --meta "sourceSha=${SHA}" --meta "releaseVersion=${VERSION}" 2> deploy.stderr) || { cat deploy.stderr >&2; echo "::error::vercel deploy failed"; exit 1; }
          cat deploy.stderr >&2
          url=$(printf '%s' "$url" | tail -n1 | tr -d '[:space:]')
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::unexpected deploy output, not a vercel.app URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          jq --arg url "$URL" '. + {deployment_url: $url}' manifest.json > production-manifest.json
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`$SHA\`"
            echo "- Version (tag, created after smoke passes): \`$VERSION\`"
            echo "- Deployment URL: $URL"
            echo
            echo '```json'
            cat production-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /api/health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 15 "$URL/api/health" || echo 000)
            if [[ "$code" == 200 ]] && jq -e '.status == "ok"' body.json > /dev/null; then
              {
                echo "## Production smoke"
                echo
                echo "- GET $URL/api/health -> 200 (attempt $attempt)"
                echo '```json'
                cat body.json
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$code" == 401 || "$code" == 403 ]]; then
            echo "::error::HTTP $code: Vercel Deployment Protection may be blocking the unique deployment URL"
          fi
          echo "::error::smoke test failed for $URL/api/health; see docs/runbooks/hosted-deploy.md for rollback"
          exit 1

      # Only this step receives the write-capable GitHub token. A failed or already-existing tag is
      # never overwritten (no force).
      - name: Create and push annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Hosted release $VERSION" -m "Source: $SHA" -m "Deployment: $URL" "$SHA"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "refs/tags/$VERSION"
          echo "- Tag \`$VERSION\` pushed on \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-manifest-${{ inputs.sha }}
          path: production-manifest.json
          if-no-files-found: ignore
