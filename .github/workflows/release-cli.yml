name: Release CLI

# Unsigned CLI/MCP release. Tags are cli-vX.Y.Z; CLI and MCP share one version.
# See docs/runbooks/cli-release.md.
on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. cli-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify tag, main ancestry, and CI status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Manual runs must come from main's copy of this workflow. Tag pushes
          # are guarded by the main-ancestry check below.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch must run from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match ^cli-v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi
          version="${TAG#cli-v}"
          if ! sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"; then
            echo "::error::Tag '$TAG' not found in the repository"
            exit 1
          fi
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::Tagged commit $sha is not reachable from origin/main"
            exit 1
          fi
          tools/deploy/verify-ci.sh "$sha"
          prerelease=false
          [ "${version%%.*}" = "0" ] && prerelease=true
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($sha) as version $version, prerelease=$prerelease"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: tools/release/build-archives.sh "$VERSION" dist "${GOOS_T}/${GOARCH_T}"
      - name: Smoke test linux/amd64 natively
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: tools/release/smoke-test.sh "dist/mealplanner_${VERSION}_linux_amd64.tar.gz" "$VERSION"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mealplanner_*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [verify, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macos-arm64, runner: macos-latest, artifact: archive-darwin-arm64, suffix: darwin_arm64.tar.gz }
          - { name: windows-amd64, runner: windows-latest, artifact: archive-windows-amd64, suffix: windows_amd64.zip }
    steps:
      - name: Check out scripts from tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Run binaries natively
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: tools/release/smoke-test.sh "dist/mealplanner_${VERSION}_${SUFFIX}" "$VERSION"

  # The release is created as a DRAFT, verified, and only then published, so
  # nothing public ever exists that has not been checked. Draft releases are
  # not visible to read-only tokens, hence contents: write on the jobs that
  # touch the draft; each job's write access is scoped to that job only.
  publish:
    name: Create draft release
    needs: [verify, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out scripts from tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS
        run: tools/release/make-checksums.sh dist
      - name: Keep build-produced SHA256SUMS for later comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # Close the tag-move race: the tag must still point at the verified commit.
          now="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [ "$now" != "$SHA" ]; then
            echo "::error::Tag $TAG now points at $now, not the verified commit $SHA"
            exit 1
          fi
          # Re-runs: replace a leftover draft, refuse to touch a published release.
          existing="$(gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | \"\(.id) \(.draft)\"")"
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" != "true" ]; then
              echo "::error::A published release for $TAG already exists; delete it (keep the tag) before re-running"
              exit 1
            fi
            echo "Deleting leftover draft release $id for $TAG"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done <<< "$existing"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/mealplanner_* dist/SHA256SUMS \
            --repo "$REPO" --draft --verify-tag --target "$SHA" \
            --title "mealplanner ${VERSION}" \
            --notes "Unsigned CLI and MCP release ${VERSION}. Verify downloads against SHA256SUMS; see docs/runbooks/cli-release.md." \
            "${flags[@]}"

  verify-published:
    name: Verify draft assets
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to see/download the draft; this job never modifies it
    steps:
      - name: Download build-produced SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: expected
      - name: Download draft assets fresh and verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          expected_dir="$PWD/expected"
          dir="$(mktemp -d)"
          # Drafts are only reachable by release id, not by tag.
          assets="$(gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .assets[] | \"\(.id) \(.name)\"")"
          if [ -z "$assets" ]; then
            echo "::error::No draft release with assets found for $TAG"
            exit 1
          fi
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/${REPO}/releases/assets/${id}" > "$dir/$name"
          done <<< "$assets"
          cd "$dir"
          want="$(printf '%s\n' \
            "mealplanner_${VERSION}_darwin_amd64.tar.gz" \
            "mealplanner_${VERSION}_darwin_arm64.tar.gz" \
            "mealplanner_${VERSION}_linux_amd64.tar.gz" \
            "mealplanner_${VERSION}_linux_arm64.tar.gz" \
            "mealplanner_${VERSION}_windows_amd64.zip" \
            "SHA256SUMS" | LC_ALL=C sort)"
          got="$(printf '%s\n' * | LC_ALL=C sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::Draft assets differ from the expected set"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          if ! cmp SHA256SUMS "$expected_dir/SHA256SUMS"; then
            echo "::error::Draft SHA256SUMS differs from the one produced by the build"
            exit 1
          fi
          sha256sum -c SHA256SUMS

  release:
    name: Publish verified release
    needs: [verify, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # Close the tag-move race again: on mismatch fail and stay a draft.
          now="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [ "$now" != "$SHA" ]; then
            echo "::error::Tag $TAG now points at $now, not the verified commit $SHA; leaving the release as a draft"
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false

  cleanup:
    name: Delete failed draft
    needs: [publish, verify-published, release]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.verify-published.result == 'failure' || needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the draft release, never a published one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Select drafts only, so a published release is never deleted.
          ids="$(gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")"
          for id in $ids; do
            echo "Deleting draft release $id for $TAG (tag is kept)"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done
